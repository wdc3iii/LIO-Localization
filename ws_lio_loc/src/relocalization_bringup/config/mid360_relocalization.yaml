/**:
    ros__parameters:
        feature_extract_enable: false
        # Applied AFTER deskewing, to the LIO cloud only. Left at 1 here because
        # scan_lock's ICP subscribes to /cloud_registered, which carries the LIO
        # cloud -- raise it to 3 to lighten the EKF, but repoint scan_lock's
        # topics.lidar_topic at cloud_registered_dense first.
        point_filter_num: 1
        # Applied in preprocess, before deskewing, so it thins EVERYTHING downstream.
        point_filter_num_for_preprocessing: 1
        max_iteration: 3
        filter_size_surf: 0.5
        filter_size_map: 0.5
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            odom_frame: "odom"
            time_sync_en: false         # ONLY turn on when external time synchronization is really not possible
            time_offset_lidar_to_imu: 0.0 # Time offset between lidar and IMU calibrated by other algorithms, e.g. LI-Init (can be found in README).
                                        # This param will take effect no matter what time_sync_en is. So if the time offset is not known exactly, please set as 0.0

        gravity_alignment:
            enable_gravity_alignment: true
            imu_collection_duration: 1.0
            heading_lidar: [-1.0, 0.0, 0.]

        preprocess:
            lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR, 4 for any other pointcloud input
            scan_line:  4
            # Cut applied in preprocess -- affects the LIO *and* every published cloud.
            blind: 0.5
            # Additional cut applied after deskewing, to the LIO cloud only. Tested
            # against each point's raw pre-deskew range, so the radius is exact. To
            # run the LIO with a 1 m blind while still publishing close-in points,
            # set blind: 0.05 and blind_lio: 1.0.
            blind_lio: 0.0
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  true      # true: enable the online estimation of IMU-LiDAR extrinsic
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true                 # true: publish Path
            effect_map_en: false          # true: publish Effects
            map_en: false                 # true: publish Map cloud
            scan_publish_en:  true        # false: close all the point cloud output
            dense_publish_en: true        # false: low down the points number in a global-frame point clouds scan.
            dense_full_publish_en: true   # true: publish /cloud_registered_dense -- the full deskewed
                                          #       scan, bypassing point_filter_num and blind_lio
            scan_bodyframe_pub_en: false  # true: output the point cloud scans in IMU-body-frame

        pcd_save:
            pcd_save_en: false
            dense: true                   # true: save the full deskewed cloud instead of the LIO cloud
